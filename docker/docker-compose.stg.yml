services:
  app:
    image: undangan-stg:latest

    build:
      context: ..
      dockerfile: Dockerfile

    container_name: undangan_stg_app

    restart: unless-stopped

    ports:
      - "8020:80"

    env_file:
      - ../.env

    volumes:
      - ..:/var/www/html

    networks:
      - shared

  queue:
    image: undangan-stg:latest

    container_name: undangan_stg_queue

    restart: unless-stopped

    command: php artisan queue:work --sleep=3 --tries=3

    env_file:
      - ../.env

    volumes:
      - ..:/var/www/html

    networks:
      - shared

networks:
  shared:
    external: true